name: Release Android

# Para publicar uma nova versão de testes:
#   1. atualize "version" no package.json (ex.: 0.2.0)
#   2. git tag v0.2.0 && git push origin v0.2.0
# O workflow gera o APK e cria o Release no GitHub com o arquivo anexado.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - name: Instalar dependências e testar
        run: |
          npm ci
          npm test

      - name: Build web + sync Android
        run: npm run android:sync

      - name: Versão
        id: ver
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "name=$VERSION" >> "$GITHUB_OUTPUT"
          echo "code=$(git rev-list --count HEAD)" >> "$GITHUB_OUTPUT"

      - name: Keystore (opcional)
        id: ks
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "path=$RUNNER_TEMP/release.jks" >> "$GITHUB_OUTPUT"
          fi

      - name: Build APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ steps.ks.outputs.path }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ARGS="-PversionName=${{ steps.ver.outputs.name }} -PversionCode=${{ steps.ver.outputs.code }}"
          mkdir -p ../out
          if [ -n "$ANDROID_KEYSTORE_PATH" ]; then
            ./gradlew assembleRelease bundleRelease $ARGS
            cp app/build/outputs/apk/release/app-release.apk ../out/Gastei-${{ steps.ver.outputs.name }}.apk
            cp app/build/outputs/bundle/release/app-release.aab ../out/Gastei-${{ steps.ver.outputs.name }}.aab
          else
            # Sem keystore configurada: APK de testes assinado com chave de debug
            ./gradlew assembleDebug $ARGS
            cp app/build/outputs/apk/debug/app-debug.apk ../out/Gastei-${{ steps.ver.outputs.name }}-teste.apk
          fi

      - name: Publicar Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*
          prerelease: ${{ startsWith(steps.ver.outputs.name, '0.') }}
          generate_release_notes: true

      - name: Artefato (execução manual)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: gastei-android
          path: out/*
